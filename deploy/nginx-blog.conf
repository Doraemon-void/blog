# Dora 博客的 nginx 反向代理配置
#
# 装法（在服务器上，仓库根目录里执行）：
#   sudo cp deploy/nginx-blog.conf /etc/nginx/sites-available/blog
#   sudo ln -s /etc/nginx/sites-available/blog /etc/nginx/sites-enabled/blog
#   sudo rm -f /etc/nginx/sites-enabled/default      # ← 别漏，见下面的说明
#   sudo nginx -t && sudo systemctl reload nginx
#
# 为什么要有这一层：Next.js 官方建议前面挂一个反向代理而不是让 next start
# 直接对公网。畸形请求、慢连接、超大请求体这些脏活交给 nginx，Node 只管渲染。

server {
    listen 80;
    listen [::]:80;

    # 阶段一（还没有域名）：下划线表示"任何 Host 都命中这个 server 块"，
    # 所以你用 http://IP 就能访问。
    #
    # 阶段二（域名备案下来之后）把它改成你的域名，例如：
    #   server_name blog.example.com;
    #
    # 注意：Ubuntu 自带的 /etc/nginx/sites-enabled/default 也是一个
    # `listen 80; server_name _;` —— 两份配置同名会让 nginx 报警告并可能命中
    # 错的那一份，所以上面的装法里有 `rm -f .../sites-enabled/default` 这一步。
    server_name _;

    # 博客正文里的插图走 /_next 和 /notes 下的静态文件，1m 够用；
    # 调大只是给将来可能的上传留余地。
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # 让 Next 知道访客的真实 IP 和协议。不设的话它看到的永远是 127.0.0.1，
        # 日志和将来的跳转逻辑都会错。
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /_next/static 下的文件名带内容 hash，Next 已经给了
        # `Cache-Control: public, max-age=31536000, immutable`。
        # 这里刻意不覆盖任何缓存头 —— 覆盖了要么浪费带宽，要么把带回退策略的
        # 页面（ISR）缓存错。
    }
}
